# AlgoAgentX DEV infrastructure for local Windows API + alert worker
# Place this file at project root beside docker-compose.yml
# Run with:
# docker compose --env-file .env.dev -f docker-compose.dev.phase1-fixed.yml up -d postgres_dev redis_dev

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: algoagentx_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algoagentx_dev}
      POSTGRES_USER: ${POSTGRES_USER:-algoagentx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Dev DB uses Windows port 5433 so prod can keep 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algoagentx_user} -d ${POSTGRES_DB:-algoagentx_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis_dev:
    image: redis:7-alpine
    container_name: algoagentx_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_dev:/data
    ports:
      # Use 6380 on Windows so production Redis can keep 6379 if both are running.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:
  redis_data_dev:
