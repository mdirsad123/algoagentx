[tool.poetry]
name = "algoagentx-api"
version = "0.1.0"
description = "AlgoAgentX SaaS FastAPI backend"
authors = ["Irsad"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# FastAPI backend
fastapi = "^0.118.0"
uvicorn = { extras = ["standard"], version = "^0.40.0" }
python-multipart = "^0.0.20"

# Config / validation
pydantic = "^2.8.0"
pydantic-settings = "^2.12.0"
email-validator = "^2.2.0"
python-dotenv = "^1.0.0"

# Database
sqlalchemy = "^2.0.45"
asyncpg = "0.29.0"
alembic = "^1.17.2"
psycopg2-binary = "^2.9.11"
aiosqlite = "^0.20.0"

# Auth / security
python-jose = { extras = ["cryptography"], version = "^3.5.0" }
bcrypt = "^4.1.3"
cryptography = "^42.0.0"
google-auth = "^2.35.0"

# Payments
razorpay = "1.4.2"

# Broker / MT5 live trading
metatrader5 = { version = "^5.0.5735", markers = "sys_platform == 'win32'" }

# Backtesting / reports
pandas = "^2.2.3"
numpy = "^1.26.4"
openpyxl = "^3.1.5"

# AI Screener / external fetching
aiohttp = "^3.10.11"
beautifulsoup4 = "^4.12.3"
tenacity = "^9.0.0"

# Background jobs / cache
celery = "^5.6.2"
redis = { extras = ["hiredis"], version = "^7.1.0" }

# Utilities
requests = "^2.31.0"
orjson = "^3.10.0"
pytz = "^2024.1"
loguru = "^0.7.3"
setuptools = "<82"
reportlab = "^4.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "0.9.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"