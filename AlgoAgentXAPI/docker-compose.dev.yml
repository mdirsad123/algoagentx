services:
  postgres:
    image: postgres:16-alpine
    container_name: algoagentx_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: algoagentx_dev
      POSTGRES_USER: algoagentx_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - algoagentx_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoagentx_user -d algoagentx_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: algoagentx_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - algoagentx_redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  algoagentx_postgres_dev_data:
  algoagentx_redis_dev_data:
