# AlgoAgentX production-style Docker Compose
# Place this file at project root beside AlgoAgentXAPI/ and AlgoAgentXApp/
# Run with: docker compose --env-file .env.prod up -d --build

services:
  postgres_prod:
    image: postgres:16-alpine
    container_name: algoagentx_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algoagentx_db}
      POSTGRES_USER: ${POSTGRES_USER:-algoagentx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Remove this port mapping on production if DB should not be reachable publicly.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algoagentx_user} -d ${POSTGRES_DB:-algoagentx_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: algoagentx_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Resource-safe defaults for the full live stack. Override in .env.prod on
      # larger Oracle instances if you intentionally want more API workers.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Optional: keep generated reports/uploads persistent if your API writes local files.
      - api_runtime_data:/app/runtime_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  alert_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_alert_worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["python", "-m", "app.services.alerts.worker"]
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker containers do not expose HTTP /health. Docker checks only process
    # liveness; application readiness/Redis status is reported by the live UI.
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert 'app.services.alerts.worker' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  live_market_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_live_market_worker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["python", "-m", "app.services.live.live_market_worker"]
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Do not make Docker liveness depend on a Redis heartbeat key. A transient
      # Redis/DNS stall should show DEGRADED in the app and recover in-place, not
      # mark every worker container unhealthy.
      test: ["CMD", "python", "-c", "import pathlib; assert 'app.services.live.live_market_worker' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  live_strategy_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_live_strategy_worker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["python", "-m", "app.services.live.live_strategy_worker"]
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Do not make Docker liveness depend on a Redis heartbeat key. A transient
      # Redis/DNS stall should show DEGRADED in the app and recover in-place, not
      # mark every worker container unhealthy.
      test: ["CMD", "python", "-c", "import pathlib; assert 'app.services.live.live_strategy_worker' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  live_reconcile_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_live_reconcile_worker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["python", "-m", "app.services.live.live_reconcile_worker"]
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Reconciliation can start independently and report its own health.
      # Do not make the whole Compose startup fail while the market worker is
      # still establishing broker feeds / writing its first heartbeat.
      live_market_worker:
        condition: service_started
    healthcheck:
      # Do not make Docker liveness depend on a Redis heartbeat key. A transient
      # Redis/DNS stall should show DEGRADED in the app and recover in-place, not
      # mark every worker container unhealthy.
      test: ["CMD", "python", "-c", "import pathlib; assert 'app.services.live.live_reconcile_worker' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  live_position_manager_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_live_position_manager_worker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["python", "-m", "app.services.live.live_position_manager_worker"]
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Do not make Docker liveness depend on a Redis heartbeat key. A transient
      # Redis/DNS stall should show DEGRADED in the app and recover in-place, not
      # mark every worker container unhealthy.
      test: ["CMD", "python", "-c", "import pathlib; assert 'app.services.live.live_position_manager_worker' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Optional worker. Enable only if you use Celery jobs/background queues.
  celery_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_celery_worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert 'celery' in pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles:
      - worker

  # Dedicated low-concurrency worker for large broker candle warm-ups.
  # Keeps 20k+ history downloads off FastAPI and the live strategy event worker.
  live_history_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_live_history_worker
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_prod:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--prefetch-multiplier=1", "--max-tasks-per-child=1", "--without-gossip", "--without-mingle", "-Q", "live_history", "-n", "live_history@%h"]
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Process liveness only. The task queue itself reports READY/RETRYING/FAILED
    # through Redis status; avoid inspect-ping chatter and false unhealthy states.
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; c=pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore'); assert 'celery' in c and 'live_history' in c"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./AlgoAgentXApp
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_SERVER: ${NEXT_PUBLIC_API_SERVER}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-600000}
        NEXT_PUBLIC_HEAVY_API_TIMEOUT_MS: ${NEXT_PUBLIC_HEAVY_API_TIMEOUT_MS:-600000}
        NEXT_PUBLIC_POLLING_API_TIMEOUT_MS: ${NEXT_PUBLIC_POLLING_API_TIMEOUT_MS:-30000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_UPSTOX_REDIRECT_URI: ${NEXT_PUBLIC_UPSTOX_REDIRECT_URI}
        NEXT_PUBLIC_SECRET_KEY: ${NEXT_PUBLIC_SECRET_KEY}
    container_name: algoagentx_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  api_runtime_data:
