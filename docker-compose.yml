# AlgoAgentX production-style Docker Compose
# Place this file at project root beside AlgoAgentXAPI/ and AlgoAgentXApp/
# Run with: docker compose --env-file .env.prod up -d --build

services:
  postgres_prod:
    image: postgres:16-alpine
    container_name: algoagentx_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algoagentx_db}
      POSTGRES_USER: ${POSTGRES_USER:-algoagentx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Remove this port mapping on production if DB should not be reachable publicly.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algoagentx_user} -d ${POSTGRES_DB:-algoagentx_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: algoagentx_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-algo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-algo_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Optional: keep generated reports/uploads persistent if your API writes local files.
      - api_runtime_data:/app/runtime_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional worker. Enable only if you use Celery jobs/background queues.
  celery_worker:
    build:
      context: ./AlgoAgentXAPI
      dockerfile: Dockerfile.prod
    container_name: algoagentx_celery_worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-algo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-algo_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - worker

  web:
    build:
      context: ./AlgoAgentXApp
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_SERVER: ${NEXT_PUBLIC_API_SERVER}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-600000}
        NEXT_PUBLIC_HEAVY_API_TIMEOUT_MS: ${NEXT_PUBLIC_HEAVY_API_TIMEOUT_MS:-600000}
        NEXT_PUBLIC_POLLING_API_TIMEOUT_MS: ${NEXT_PUBLIC_POLLING_API_TIMEOUT_MS:-30000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_UPSTOX_REDIRECT_URI: ${NEXT_PUBLIC_UPSTOX_REDIRECT_URI}
        NEXT_PUBLIC_SECRET_KEY: ${NEXT_PUBLIC_SECRET_KEY}
    container_name: algoagentx_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  api_runtime_data:
